# ЛР 19: Конфигурация облачного развертывания на Render (вместо Heroku)
databases:
  - name: nestjs-labs-db
    databaseName: nestjs_labs
    user: nestjs_user
    plan: free

services:
  - type: web
    name: nestjs-labs-16-19
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nestjs-labs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
