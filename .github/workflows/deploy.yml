name: CI/CD Pipeline (Test, Build, Docker Hub & Render Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-and-deploy:
    name: Test, Build Docker Image and Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Verify secrets are not empty
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DH_USER" ]; then echo "ОШИБКА: секрет DOCKERHUB_USERNAME пустой или не найден в Repository secrets!"; exit 1; fi
          if [ -z "$DH_PASS" ]; then echo "ОШИБКА: секрет DOCKERHUB_TOKEN пустой или не найден в Repository secrets!"; exit 1; fi
          if [ -z "$RENDER_HOOK" ]; then echo "ОШИБКА: секрет RENDER_DEPLOY_HOOK_URL пустой или не найден в Repository secrets!"; exit 1; fi
          echo "Все 3 секрета успешно прочитаны."

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nestjs-labs-16-19:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nestjs-labs-16-19:${{ github.sha }}

      - name: Trigger Render Deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
